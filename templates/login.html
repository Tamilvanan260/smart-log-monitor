<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login – Smart Log Monitor</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet" />
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}" />
  <style>
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(ellipse at 50% 0%,
        rgba(13, 202, 240, 0.06) 0%, transparent 65%),
        var(--color-bg, #0f1117);
    }
    .login-card {
      width: 100%;
      max-width: 400px;
    }
    .login-logo {
      font-size: 2rem;
    }
    .form-control:focus {
      background-color: #12151f;
      border-color: #0dcaf0;
      box-shadow: 0 0 0 2px rgba(13,202,240,0.15);
      color: #e2e8f0;
    }
    .form-control {
      background-color: #12151f;
      border-color: #2a2d3a;
      color: #e2e8f0;
    }
    .form-control::placeholder { color: #6c757d; }
    .input-group-text {
      background-color: #1a1d27;
      border-color: #2a2d3a;
      color: #6c757d;
    }
  </style>
</head>
<body>

<div class="login-card mx-auto px-3">

  <!-- Brand -->
  <div class="text-center mb-4">
    <div class="login-logo mb-2">
      <i class="bi bi-activity text-info"></i>
    </div>
    <h5 class="fw-bold text-white mb-0">SmartLog<span class="text-info">Monitor</span></h5>
    <p class="text-secondary small mt-1">Sign in to your account</p>
  </div>

  <!-- Flash messages -->
  {% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}
      {% for category, message in messages %}
      <div class="alert alert-{{ category }} alert-dismissible fade show shadow-sm mb-3" role="alert">
        <i class="bi bi-{% if category == 'danger' %}exclamation-triangle{% elif category == 'success' %}check-circle{% else %}info-circle{% endif %} me-2"></i>
        {{ message }}
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
      </div>
      {% endfor %}
    {% endif %}
  {% endwith %}

  <!-- Login form card -->
  <div class="card border-0 shadow-lg" style="background:#1a1d27;border:1px solid #2a2d3a!important;">
    <div class="card-body p-4">
      <form method="POST" action="{{ url_for('auth.login') }}" novalidate>
        <input type="hidden" name="next" value="{{ request.args.get('next', '') }}" />

        <!-- Username -->
        <div class="mb-3">
          <label for="username" class="form-label text-secondary small fw-semibold">
            Username
          </label>
          <div class="input-group">
            <span class="input-group-text">
              <i class="bi bi-person"></i>
            </span>
            <input type="text" id="username" name="username"
                   class="form-control"
                   value="{{ username }}"
                   placeholder="Enter username"
                   autocomplete="username"
                   autofocus required />
          </div>
        </div>

        <!-- Password -->
        <div class="mb-3">
          <label for="password" class="form-label text-secondary small fw-semibold">
            Password
          </label>
          <div class="input-group">
            <span class="input-group-text">
              <i class="bi bi-lock"></i>
            </span>
            <input type="password" id="password" name="password"
                   class="form-control"
                   placeholder="Enter password"
                   autocomplete="current-password"
                   required />
            <button type="button" class="input-group-text border-start-0"
                    style="cursor:pointer;" onclick="togglePwd()"
                    title="Show / hide password">
              <i class="bi bi-eye" id="pwdToggleIcon"></i>
            </button>
          </div>
        </div>

        <!-- Remember me -->
        <div class="mb-4 d-flex align-items-center">
          <div class="form-check mb-0">
            <input type="checkbox" class="form-check-input" id="remember"
                   name="remember" style="background-color:#12151f;border-color:#2a2d3a;">
            <label class="form-check-label text-secondary small" for="remember">
              Keep me signed in
            </label>
          </div>
        </div>

        <!-- Submit -->
        <button type="submit" class="btn btn-info text-white w-100 py-2 fw-semibold">
          <i class="bi bi-box-arrow-in-right me-2"></i>Sign In
        </button>

      </form>
    </div>
  </div>

  <!-- Footer note -->
  <p class="text-center text-secondary small mt-4">
    <i class="bi bi-shield-lock me-1"></i>
    Smart Log Monitoring &amp; Alert System
  </p>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
function togglePwd() {
  const inp  = document.getElementById("password");
  const icon = document.getElementById("pwdToggleIcon");
  if (inp.type === "password") {
    inp.type = "text";
    icon.className = "bi bi-eye-slash";
  } else {
    inp.type = "password";
    icon.className = "bi bi-eye";
  }
}
</script>
</body>
</html>
